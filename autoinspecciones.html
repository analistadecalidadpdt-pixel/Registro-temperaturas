<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pan de Tata - Autoinspecciones</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

  <header class="app-header">
    <div class="header-container">
      <div class="header-flex">
        <img src="logo.png" alt="Logo Pan de Tata" class="app-logo">
        <div class="header-text">
          <h1>PAN DE TATA</h1>
          <small>Autoinspección F-CC-01-001</small>
        </div>
      </div>
    </div>
  </header>

  <main class="app-container">
    <section id="pantalla-inicio" class="card fade-in">
      <h2>Datos de la Inspección</h2>
      
      <div class="form-group">
        <label for="fecha"><i class="fa-regular fa-calendar"></i> Fecha de Inspección</label>
        <input type="date" id="fecha" required>
      </div>

      <div class="form-group">
        <label for="inspector"><i class="fa-regular fa-user"></i> Nombre del Inspector</label>
        <input type="text" id="inspector" placeholder="Ej. Paola Gonzalez" required>
      </div>

      <div class="form-group">
        <label for="area"><i class="fa-solid fa-map-location-dot"></i> Área a Inspeccionar</label>
        <select id="area" required>
          <option value="">Cargando áreas disponibles...</option>
        </select>
      </div>

      <div class="form-group status-group">
        <label>¿El área está en producción?</label>
        <div class="radio-toggle">
          <input type="radio" id="prod-si" name="enProduccion" value="SI" checked>
          <label for="prod-si">SÍ</label>
          <input type="radio" id="prod-no" name="enProduccion" value="NO">
          <label for="prod-no">NO</label>
        </div>
      </div>

      <button type="button" id="btn-comenzar" class="btn-primary" disabled>
        Comenzar Inspección <i class="fa-solid fa-arrow-right"></i>
      </button>
    </section>

    <section id="pantalla-formulario" class="fade-in hidden">
      <div class="sticky-calc">
        <div class="calc-box">
          <span class="label">Cumplimiento</span>
          <span id="live-pct" class="value">0%</span>
        </div>
        <div class="area-badge">
          <i class="fa-solid fa-location-dot"></i> <span id="active-area-name">-</span>
        </div>
      </div>

      <div id="contenedor-preguntas"></div>

      <div class="form-actions">
        <button type="button" id="btn-enviar" class="btn-success">
          <i class="fa-solid fa-cloud-arrow-up"></i> Enviar Inspección
        </button>
      </div>
    </section>

    <!-- Corregido el ID: pantalla-exito -->
    <section id="pantalla-exito" class="card text-center fade-in hidden">
      <div class="success-icon">
        <i class="fa-solid fa-circle-check"></i>
      </div>
      <h2>¡Inspección Guardada!</h2>
      <p>Los datos se han registrado automáticamente en Google Sheets.</p>
      <div class="id-badge">ID: <span id="generated-id">-</span></div>
      <button type="button" onclick="window.location.reload()" class="btn-secondary">
        <i class="fa-solid fa-rotate-right"></i> Nueva Inspección
      </button>
    </section>
  </main>

  <div id="loading-overlay" class="hidden">
    <div class="spinner"></div>
    <p>Sincronizando con Google Sheets...</p>
  </div>

  <script src="app.js"></script>

</body>
</html>
